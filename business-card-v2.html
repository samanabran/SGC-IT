<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGC Tech AI Business Card</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Raleway', sans-serif; }
    .card { width: 480px; height: 270px; position: relative; overflow: hidden; }
    .gold { color: #c9a84c; }
    .bg-gold { background-color: #c9a84c; }
    .front-black { clip-path: polygon(0 0, 38% 0, 38% 100%, 0 100%); }
    .front-divider {
      position: absolute; top: 0; left: 38%;
      width: 2px; height: 100%; background: #c9a84c; z-index: 25;
    }
    .field-label { font-size: 11px; font-weight: 600; color: #444; letter-spacing: .04em; }
    .field-input {
      width: 100%; padding: 8px 10px; border: 1px solid #d8d2c4; border-radius: 6px;
      font-size: 13px; outline: none; background: #fff; color: #1f1f1f; transition: border-color .15s;
    }
    .field-input:focus { border-color: #c9a84c; }

    /* ===== PRINT STYLES ===== */
    @media print {
      @page {
        size: A4;
        margin: 12mm;
      }

      /* Hide everything except the two cards */
      body > *:not(.print-area) { display: none !important; }
      body { background: white !important; padding: 0 !important; gap: 0 !important; min-height: auto !important; }
      #edit-form { display: none !important; }

      .print-area {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        gap: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* Flatten the flex-row wrapper so pages break properly */
      .print-area > [class*="flex"] {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        gap: 0 !important;
        flex-wrap: nowrap !important;
      }

      /* Front card — page 1 */
      .card-front-print {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        height: 100vh !important;
        page-break-after: always !important;
        break-after: page !important;
      }

      /* Back card — page 2 */
      .card-back-print {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        height: 100vh !important;
      }

      /* Override card to physical business card size */
      .card {
        width: 85.6mm !important;
        height: 54mm !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        border: none !important;
        overflow: hidden !important;
        page-break-inside: avoid !important;
        position: relative !important;
      }

      /* SVG must stretch to fill card */
      .card svg {
        width: 100% !important;
        height: 100% !important;
      }

      /* Fix z-index stacking for print */
      .card .z-10,
      .card .z-20,
      .card .z-30,
      .card .front-divider,
      .card [class*="z-"] {
        z-index: auto !important;
      }
      .card .absolute { position: absolute !important; }

      /* Front card black section — use explicit background instead of clip-path */
      .front-black {
        clip-path: polygon(0 0, 38% 0, 38% 100%, 0 100%) !important;
        -webkit-clip-path: polygon(0 0, 38% 0, 38% 100%, 0 100%) !important;
      }

      /* QR background white ensures it prints */
      #qr-code svg { max-width: 100% !important; height: auto !important; }
      #qr-code { background: white !important; }

      /* Ensure gold text prints */
      .gold, [style*="color: rgb(201, 168, 76)"] { color: #c9a84c !important; }

      /* Ensure black sections print solid */
      .front-black, [style*="background: rgb(31, 31, 31)"] { background-color: #1f1f1f !important; }
      svg polygon[fill="#1f1f1f"] { fill: #1f1f1f !important; }
      svg rect[fill="#1f1f1f"] { fill: #1f1f1f !important; }

      /* White text on black sections */
      .card [style*="color: rgb(201, 168, 76)"] { color: #c9a84c !important; }

      /* Downgrade images to draft quality when the browser supports it */
      img { max-width: 100% !important; }

      /* Font sizes need to scale to physical card */
      .card h1 { font-size: 16px !important; }
      .card h2 { font-size: 14px !important; }
      .card [style*="font-size: 13px"] { font-size: 9px !important; }
      .card [style*="font-size: 12px"] { font-size: 8.5px !important; }
      .card [style*="font-size: 10px"] { font-size: 7px !important; }
      .card [style*="font-size: 9px"] { font-size: 6.5px !important; }
      .card [style*="font-size: 8.5px"] { font-size: 6px !important; }
      .card img[style*="width: 130px"] { width: 38mm !important; height: 38mm !important; }

      /* Gold divider line */
      .card [style*="background: #c9a84c"] { background-color: #c9a84c !important; }

      /* Social icons */
      .card [style*="background:#c9a84c"] { background: #c9a84c !important; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
   <script src="/_sdk/telemetry_sdk.js"></script>
   <script>
     function printCards() { window.print(); }
   </script></head>
 <body data-template-id="__page-root" class="min-h-screen flex flex-col items-center justify-start gap-8 p-6" style="background: rgb(245, 240, 232);">

  <!-- ===================== CARDS ===================== -->
  <div class="print-area">
    <div class="flex flex-row items-center justify-center gap-8 flex-wrap">

    <!-- ============================= FRONT CARD ============================= -->
    <div class="card-front-print">
     <div class="card rounded shadow-xl border border-gray-200">
      <div data-template-id="front-cream-section" class="canva-section absolute inset-0" style="background: rgb(245, 245, 240);"></div>
      <div data-template-id="front-black-section" class="canva-section absolute inset-0 front-black z-10" style="background: rgb(31, 31, 31);"></div>
      <div class="front-divider"></div>

      <div class="absolute inset-0 z-20 flex items-center justify-center" style="width: 38%;">
       <img data-template-id="front-logo" class="canva-image object-contain"
            style="width: 130px; height: 130px;" loading="lazy"
            src="https://res.cloudinary.com/dsl5fhclj/image/upload/v1780509117/l50wi2fdg5o0zoiohioi.png"
            alt="SGC Tech AI gold logo design">
      </div>

      <div class="absolute inset-0 flex flex-col justify-center z-10" style="padding-left: 44%; padding-right: 24px;">
       <h1 id="out-company-f" data-template-id="front-company-name" class="canva-text font-bold tracking-wide"
           style="color: rgb(26, 26, 26); font-weight: 700; font-size: 22px; line-height: 1.1;">SGC TECH AI</h1>
       <p id="out-tagline-f" data-template-id="front-tagline" class="canva-text tracking-widest uppercase mt-1"
          style="color: rgb(31,31,31); font-weight: 500; font-size: 10px; letter-spacing: 0.18em;">GLOBAL CONSULTANTS</p>
       <div style="width: 70%; height: 1px; background: #c9a84c; margin-top: 10px; margin-bottom: 14px;"></div>
       <div class="space-y-3">
        <div class="flex items-center gap-3">
          <i class="fa-regular fa-envelope gold" style="font-size: 13px; width: 16px; text-align:center;"></i>
          <span id="out-email" data-template-id="front-email" class="canva-text" style="color: rgb(40,40,40); font-weight: 500; font-size: 13px;">info@sgctech.ai</span>
        </div>
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-phone gold" style="font-size: 13px; width: 16px; text-align:center;"></i>
          <span id="out-phone" data-template-id="front-phone" class="canva-text" style="color: rgb(40,40,40); font-weight: 500; font-size: 13px;">+971 52 198 5231</span>
        </div>
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-globe gold" style="font-size: 13px; width: 16px; text-align:center;"></i>
          <span id="out-website" data-template-id="front-website" class="canva-text" style="color: rgb(40,40,40); font-weight: 500; font-size: 13px;">www.sgctech.ai</span>
        </div>
       </div>
      </div>
     </div>
    </div>

    <!-- ============================= BACK CARD ============================= -->
    <div class="card-back-print">
     <div class="card rounded shadow-xl border border-gray-200">
      <svg viewBox="0 0 480 270" width="480" height="270" class="absolute inset-0" preserveAspectRatio="none">
        <!-- Cream base -->
        <rect x="0" y="0" width="480" height="270" fill="#f5f5f0"/>

        <!-- TOP-RIGHT black block: clean angled block with one diagonal seam -->
        <polygon points="172,0 480,0 480,180 360,180" fill="#1f1f1f"/>

        <!-- Bottom-left black triangle -->
        <polygon points="0,150 150,270 0,270" fill="#1f1f1f"/>

        <!-- GOLD HAIRLINES -->
        <line x1="158" y1="0" x2="346" y2="186" stroke="#c9a84c" stroke-width="1.5"/>
        <line x1="22" y1="150" x2="166" y2="270" stroke="#c9a84c" stroke-width="1.5"/>
        <line x1="155" y1="224" x2="452" y2="224" stroke="#c9a84c" stroke-width="1.5"/>
      </svg>

      <div class="absolute z-20" style="top: 24px; left: 26px;">
       <h2 id="out-company-b" data-template-id="back-company-name" class="canva-text font-semibold tracking-wide"
           style="color: rgb(201, 168, 76); font-weight: 600; font-size: 20px; line-height: 1.1;">SGC TECH AI</h2>
       <p id="out-tagline-b" data-template-id="back-tagline" class="canva-text tracking-widest uppercase mt-1"
          style="color: rgb(201, 168, 76); font-size: 9px; letter-spacing: 0.18em;">GLOBAL CONSULTANTS</p>
      </div>

      <!-- QR raised so it clears the motto -->
      <div class="absolute z-30" style="top: 70px; right: 70px;">
        <div style="position: relative; padding: 7px; background: #ffffff;">
          <span style="position:absolute;top:-4px;left:-4px;width:16px;height:16px;border-top:2px solid #c9a84c;border-left:2px solid #c9a84c;"></span>
          <span style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-top:2px solid #c9a84c;border-right:2px solid #c9a84c;"></span>
          <span style="position:absolute;bottom:-4px;left:-4px;width:16px;height:16px;border-bottom:2px solid #c9a84c;border-left:2px solid #c9a84c;"></span>
          <span style="position:absolute;bottom:-4px;right:-4px;width:16px;height:16px;border-bottom:2px solid #c9a84c;border-right:2px solid #c9a84c;"></span>
          <div id="qr-code"></div>
        </div>
      </div>

      <div class="absolute z-30" style="left: 22px; bottom: 18px;">
       <p data-template-id="back-connect" class="canva-text uppercase tracking-widest mb-2"
          style="color: rgb(201, 168, 76); font-weight: 600; font-size: 8.5px; letter-spacing: 0.2em;">CONNECT WITH US</p>
       <div class="flex gap-2">
         <span class="flex items-center justify-center rounded-full" style="width:19px;height:19px;background:#c9a84c;color:#1f1f1f;"><i class="fa-brands fa-linkedin-in" style="font-size:9px;"></i></span>
         <span class="flex items-center justify-center rounded-full" style="width:19px;height:19px;background:#c9a84c;color:#1f1f1f;"><i class="fa-brands fa-x-twitter" style="font-size:9px;"></i></span>
         <span class="flex items-center justify-center rounded-full" style="width:19px;height:19px;background:#c9a84c;color:#1f1f1f;"><i class="fa-brands fa-facebook-f" style="font-size:9px;"></i></span>
         <span class="flex items-center justify-center rounded-full" style="width:19px;height:19px;background:#c9a84c;color:#1f1f1f;"><i class="fa-brands fa-instagram" style="font-size:9px;"></i></span>
       </div>
      </div>

      <!-- Motto on bottom row, single line, clear of QR -->
      <div class="absolute z-30 text-right" style="right: 22px; bottom: 16px;">
       <p id="out-motto" data-template-id="back-motto" class="canva-text italic"
          style="color: rgb(201, 168, 76); font-weight: 500; font-style: italic; font-size: 12px; white-space: nowrap;">Clarity. Control. Confidence.</p>
      </div>
     </div>
    </div>

    </div><!-- /flex-row -->
  </div><!-- /print-area -->

  <!-- ===== PRINT BUTTON ===== -->
  <div class="w-full max-w-3xl flex justify-end">
    <button onclick="printCards()"
            class="px-6 py-3 rounded-lg font-bold text-sm tracking-wider uppercase shadow-md transition duration-200 hover:shadow-lg hover:-translate-y-0.5 flex items-center gap-2"
            style="background:#1f1f1f;color:#c9a84c;border:1px solid #c9a84c;">
      <i class="fa-solid fa-print"></i> Print Cards
    </button>
  </div>

  <!-- ===================== AUTO-POPULATE FORM ===================== -->
  <div id="edit-form" class="w-full max-w-3xl bg-white rounded-xl shadow-lg border border-gray-200 p-6 mt-2">
    <h3 class="text-lg font-bold mb-1" style="color:#1f1f1f;">Card Details</h3>
    <p class="text-sm text-gray-500 mb-4">Edit any field below — the cards update instantly.</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="field-label" for="in-company">Company Name</label>
        <input id="in-company" class="field-input mt-1" type="text" value="SGC TECH AI">
      </div>
      <div>
        <label class="field-label" for="in-tagline">Tagline</label>
        <input id="in-tagline" class="field-input mt-1" type="text" value="GLOBAL CONSULTANTS">
      </div>
      <div>
        <label class="field-label" for="in-email">Email</label>
        <input id="in-email" class="field-input mt-1" type="email" value="info@sgctech.ai">
      </div>
      <div>
        <label class="field-label" for="in-phone">Phone</label>
        <input id="in-phone" class="field-input mt-1" type="text" value="+971 52 198 5231">
      </div>
      <div>
        <label class="field-label" for="in-website">Website</label>
        <input id="in-website" class="field-input mt-1" type="text" value="www.sgctech.ai">
      </div>
      <div>
        <label class="field-label" for="in-motto">Motto</label>
        <input id="in-motto" class="field-input mt-1" type="text" value="Clarity. Control. Confidence.">
      </div>
    </div>
  </div>

  <script src="/_sdk/editing_sdk.js"></script>
  <script>
    function buildQR() {
      const phone   = (document.getElementById('in-phone').value || '').replace(/\s+/g, '');
      const email   = document.getElementById('in-email').value || '';
      const website = document.getElementById('in-website').value || '';
      const company = document.getElementById('in-company').value || '';
      const url = website.startsWith('http') ? website : 'https://' + website;
      const vcard = [
        'BEGIN:VCARD','VERSION:3.0','FN:' + company,
        'ORG:' + company + ' - ' + (document.getElementById('in-tagline').value || ''),
        'TEL:' + phone, 'EMAIL:' + email,
        'URL:' + url, 'END:VCARD'
      ].join('\n');
      const qr = qrcode(0, 'M');
      qr.addData(vcard);
      qr.make();
      document.getElementById('qr-code').innerHTML = qr.createSvgTag(2.6, 0);
    }

    function syncFields() {
      const company = document.getElementById('in-company').value;
      const tagline = document.getElementById('in-tagline').value;
      const email   = document.getElementById('in-email').value;
      const phone   = document.getElementById('in-phone').value;
      const website = document.getElementById('in-website').value;
      const motto   = document.getElementById('in-motto').value;

      document.getElementById('out-company-f').textContent = company;
      document.getElementById('out-company-b').textContent = company;
      document.getElementById('out-tagline-f').textContent = tagline;
      document.getElementById('out-tagline-b').textContent = tagline;
      document.getElementById('out-email').textContent     = email;
      document.getElementById('out-phone').textContent     = phone;
      document.getElementById('out-website').textContent   = website;
      document.getElementById('out-motto').textContent     = motto;

      buildQR();
    }

    document.addEventListener('DOMContentLoaded', function() {
      ['in-company','in-tagline','in-email','in-phone','in-website','in-motto']
        .forEach(id => document.getElementById(id).addEventListener('input', syncFields));
      syncFields(); // initial render + QR
    });
  </script>
</body></html>
