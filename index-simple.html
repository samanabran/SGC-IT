<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGC Tech AI Business Card</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Raleway', sans-serif; }
    .font-display { font-family: 'Playfair Display', serif; }
    .card { width: 480px; height: 270px; position: relative; overflow: hidden; }
    .gold { color: #c9a84c; }
    .bg-gold { background-color: #c9a84c; }
    .front-black { clip-path: polygon(0 0, 40% 0, 40% 100%, 0 100%); }
    .front-divider {
      position: absolute; top: 0; left: 40%;
      width: 2px; height: 100%; background: #c9a84c; z-index: 25;
    }
    .field-label { font-size: 11px; font-weight: 600; color: #444; letter-spacing: .04em; }
    .field-input {
      width: 100%; padding: 8px 10px; border: 1px solid #d8d2c4; border-radius: 6px;
      font-size: 13px; outline: none; background: #fff; color: #1f1f1f; transition: border-color .15s;
    }
    .field-input:focus { border-color: #c9a84c; }
    .btn-print {
      display: inline-flex; align-items: center; gap: 8px;
      background: #c9a84c; color: #1f1f1f; font-weight: 600; font-size: 14px;
      padding: 10px 22px; border-radius: 8px; border: none; cursor: pointer;
      transition: background .15s, transform .05s; letter-spacing: .02em;
    }
    .btn-print:hover { background: #b8973f; }
    .btn-print:active { transform: translateY(1px); }

    /* ===== PRINT STYLES: print EXACTLY what's on screen ===== */
    @media print {
      @page { size: auto; margin: 14mm; }
      body {
        background: #fff !important;
        display: block !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print { display: none !important; }
      .cards-wrap {
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 18px !important;
      }
      .card {
        width: 480px !important;
        height: 270px !important;
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        overflow: hidden !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .card, .card * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      #out-company-f, #out-company-b, #out-tagline-f, #out-tagline-b,
      #out-name, #out-position, #out-email, #out-phone, #out-website, #out-motto {
        white-space: nowrap !important;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 <script src="/_sdk/telemetry_sdk.js"></script></head>
 <body data-template-id="__page-root" class="min-h-screen flex flex-col items-center justify-start gap-8 p-6" style="background: rgb(245, 240, 232);">

  <!-- ===================== CARDS ===================== -->
  <div class="cards-wrap flex flex-row items-center justify-center gap-8 flex-wrap">

  <!-- ============================= FRONT CARD ============================= -->
  <div class="card rounded shadow-xl border border-gray-200">
   <div data-template-id="front-cream-section" class="canva-section absolute inset-0" style="background: rgb(245, 245, 240);"></div>
   <div data-template-id="front-black-section" class="canva-section absolute inset-0 front-black z-10" style="background: rgb(31, 31, 31);"></div>
   <div class="front-divider"></div>

   <div class="absolute inset-0 z-20 flex items-center justify-center" style="width: 40%;">
     <img data-template-id="front-logo" class="canva-image object-contain"
          style="width: 152px; height: 152px;" loading="eager"
          src="https://res.cloudinary.com/dsl5fhclj/image/upload/v1780509117/l50wi2fdg5o0zoiohioi.png"
          alt="SGC Tech AI gold logo design">
   </div>

   <div class="absolute inset-0 flex flex-col justify-center z-10" style="padding-left: 46%; padding-right: 18px;">
    <h1 id="out-company-f" data-template-id="front-company-name" class="canva-text font-display"
        style="color: rgb(26, 26, 26); font-weight: 700; font-size: 24px; line-height: 1.1; letter-spacing: 0.01em; white-space: nowrap;">SGC TECH AI</h1>
    <p id="out-tagline-f" data-template-id="front-tagline" class="canva-text font-display uppercase mt-1"
       style="color: rgb(31,31,31); font-weight: 500; font-size: 10.5px; letter-spacing: 0.18em; white-space: nowrap;">GLOBAL CONSULTANTS</p>

    <!-- Person name + position -->
    <p id="out-name" data-template-id="front-name" class="canva-text font-display mt-2.5"
       style="color: rgb(26,26,26); font-weight: 600; font-size: 14px; line-height: 1.1; white-space: nowrap;">John Doe</p>
    <p id="out-position" data-template-id="front-position" class="canva-text uppercase"
       style="color: rgb(201,168,76); font-weight: 600; font-size: 9px; letter-spacing: 0.14em; white-space: nowrap;">CHIEF EXECUTIVE OFFICER</p>

    <div style="width: 78%; height: 1px; background: #c9a84c; margin-top: 10px; margin-bottom: 12px;"></div>
    <div class="space-y-2.5">
     <div class="flex items-center gap-3">
       <i class="fa-regular fa-envelope gold" style="font-size: 14px; width: 17px; text-align:center;"></i>
       <span id="out-email" data-template-id="front-email" class="canva-text" style="color: rgb(40,40,40); font-weight: 500; font-size: 13px; white-space: nowrap;">info@sgctech.ai</span>
     </div>
     <div class="flex items-center gap-3">
       <i class="fa-solid fa-phone gold" style="font-size: 14px; width: 17px; text-align:center;"></i>
       <span id="out-phone" data-template-id="front-phone" class="canva-text" style="color: rgb(40,40,40); font-weight: 500; font-size: 13px; white-space: nowrap;">+971 52 198 5231</span>
     </div>
     <div class="flex items-center gap-3">
       <i class="fa-solid fa-globe gold" style="font-size: 14px; width: 17px; text-align:center;"></i>
       <span id="out-website" data-template-id="front-website" class="canva-text" style="color: rgb(40,40,40); font-weight: 500; font-size: 13px; white-space: nowrap;">www.sgctech.ai</span>
     </div>
    </div>
   </div>
  </div>

  <!-- ============================= BACK CARD ============================= -->
  <div class="card rounded shadow-xl border border-gray-200">
   <svg viewBox="0 0 480 270" width="480" height="270" class="absolute inset-0" preserveAspectRatio="none">
     <rect x="0" y="0" width="480" height="270" fill="#f5f5f0"/>
     <polygon points="172,0 480,0 480,180 360,180" fill="#1f1f1f"/>
     <polygon points="0,150 150,270 0,270" fill="#1f1f1f"/>
     <line x1="158" y1="0" x2="346" y2="186" stroke="#c9a84c" stroke-width="1.5"/>
     <line x1="22" y1="150" x2="166" y2="270" stroke="#c9a84c" stroke-width="1.5"/>
     <line x1="150" y1="232" x2="458" y2="232" stroke="#c9a84c" stroke-width="1.5"/>
   </svg>

   <!-- Company name top-left -->
   <div class="absolute z-20" style="top: 22px; left: 26px;">
    <h2 id="out-company-b" data-template-id="back-company-name" class="canva-text font-display tracking-wide"
        style="color: rgb(201, 168, 76); font-weight: 700; font-size: 22px; line-height: 1.1; white-space: nowrap;">SGC TECH AI</h2>
    <p id="out-tagline-b" data-template-id="back-tagline" class="canva-text font-display tracking-widest uppercase mt-1"
       style="color: rgb(201, 168, 76); font-size: 10px; letter-spacing: 0.18em; white-space: nowrap;">GLOBAL CONSULTANTS</p>
   </div>

   <!-- QR: upper-right zone, raised & sized so it never reaches the bottom row -->
   <div class="absolute z-30" style="top: 60px; right: 60px;">
     <div style="position: relative; padding: 6px; background: #ffffff;">
       <span style="position:absolute;top:-4px;left:-4px;width:15px;height:15px;border-top:2px solid #c9a84c;border-left:2px solid #c9a84c;"></span>
       <span style="position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-top:2px solid #c9a84c;border-right:2px solid #c9a84c;"></span>
       <span style="position:absolute;bottom:-4px;left:-4px;width:15px;height:15px;border-bottom:2px solid #c9a84c;border-left:2px solid #c9a84c;"></span>
       <span style="position:absolute;bottom:-4px;right:-4px;width:15px;height:15px;border-bottom:2px solid #c9a84c;border-right:2px solid #c9a84c;"></span>
       <div id="qr-code"></div>
     </div>
   </div>

   <!-- Bottom-left: Connect with us + social icons -->
   <div class="absolute z-30" style="left: 22px; bottom: 16px;">
    <p data-template-id="back-connect" class="canva-text uppercase tracking-widest mb-2"
       style="color: rgb(201, 168, 76); font-weight: 600; font-size: 8.5px; letter-spacing: 0.2em; white-space: nowrap;">CONNECT WITH US</p>
    <div class="flex gap-2">
      <span class="flex items-center justify-center rounded-full" style="width:19px;height:19px;background:#c9a84c;color:#1f1f1f;"><i class="fa-brands fa-linkedin-in" style="font-size:9px;"></i></span>
      <span class="flex items-center justify-center rounded-full" style="width:19px;height:19px;background:#c9a84c;color:#1f1f1f;"><i class="fa-brands fa-x-twitter" style="font-size:9px;"></i></span>
      <span class="flex items-center justify-center rounded-full" style="width:19px;height:19px;background:#c9a84c;color:#1f1f1f;"><i class="fa-brands fa-facebook-f" style="font-size:9px;"></i></span>
      <span class="flex items-center justify-center rounded-full" style="width:19px;height:19px;background:#c9a84c;color:#1f1f1f;"><i class="fa-brands fa-instagram" style="font-size:9px;"></i></span>
    </div>
   </div>

   <!-- Motto: pinned to bottom-right, on its own row below the gold line, clear of the QR -->
   <div class="absolute z-30 text-right" style="right: 22px; bottom: 14px;">
    <p id="out-motto" data-template-id="back-motto" class="canva-text font-display italic"
       style="color: rgb(201, 168, 76); font-weight: 500; font-style: italic; font-size: 13px; white-space: nowrap;">Vision. Innovation. Execution.</p>
   </div>
  </div>

  </div><!-- /cards -->

  <!-- ===================== AUTO-POPULATE FORM (hidden on print) ===================== -->
  <div class="no-print w-full max-w-3xl bg-white rounded-xl shadow-lg border border-gray-200 p-6 mt-2">
    <h3 class="text-lg font-bold mb-1 font-display" style="color:#1f1f1f;">Card Details</h3>
    <p class="text-sm text-gray-500 mb-4">Edit any field below — the cards update instantly.</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="field-label" for="in-company">Company Name</label>
        <input id="in-company" class="field-input mt-1" type="text" value="SGC TECH AI">
      </div>
      <div>
        <label class="field-label" for="in-tagline">Tagline</label>
        <input id="in-tagline" class="field-input mt-1" type="text" value="GLOBAL CONSULTANTS">
      </div>
      <div>
        <label class="field-label" for="in-name">Full Name</label>
        <input id="in-name" class="field-input mt-1" type="text" value="John Doe">
      </div>
      <div>
        <label class="field-label" for="in-position">Position / Job Title</label>
        <input id="in-position" class="field-input mt-1" type="text" value="CHIEF EXECUTIVE OFFICER">
      </div>
      <div>
        <label class="field-label" for="in-email">Email</label>
        <input id="in-email" class="field-input mt-1" type="email" value="info@sgctech.ai">
      </div>
      <div>
        <label class="field-label" for="in-phone">Phone</label>
        <input id="in-phone" class="field-input mt-1" type="text" value="+971 52 198 5231">
      </div>
      <div>
        <label class="field-label" for="in-website">Website</label>
        <input id="in-website" class="field-input mt-1" type="text" value="www.sgctech.ai">
      </div>
      <div>
        <label class="field-label" for="in-motto">Motto</label>
        <input id="in-motto" class="field-input mt-1" type="text" value="Vision. Innovation. Execution.">
      </div>
    </div>

    <div class="mt-6 flex justify-end">
      <button type="button" class="btn-print" onclick="doPrint()">
        <i class="fa-solid fa-print"></i> Print / Save as PDF
      </button>
    </div>
  </div>

  <script src="/_sdk/editing_sdk.js"></script>
  <script>
    function buildQR() {
      const company = (document.getElementById('in-company').value || '').trim();
      const tagline = (document.getElementById('in-tagline').value || '').trim();
      const name    = (document.getElementById('in-name').value || '').trim();
      const position= (document.getElementById('in-position').value || '').trim();
      const email   = (document.getElementById('in-email').value || '').trim();
      const phoneRaw= (document.getElementById('in-phone').value || '').trim();
      const website = (document.getElementById('in-website').value || '').trim();

      const phone = phoneRaw.replace(/\s+/g, '');
      const url   = website ? (website.startsWith('http') ? website : 'https://' + website) : '';

      // Structured N: field (Family;Given;Middle;Prefix;Suffix)
      let nField = '';
      if (name) {
        const parts = name.split(/\s+/);
        const given = parts.shift() || '';
        const family = parts.join(' ');
        nField = 'N:' + family + ';' + given + ';;;';
      }

      // Assemble only the lines that have values
      const lines = ['BEGIN:VCARD', 'VERSION:3.0'];
      if (nField)   lines.push(nField);
      if (name)     lines.push('FN:' + name);
      if (position) lines.push('TITLE:' + position);
      if (company)  lines.push('ORG:' + company + (tagline ? ';' + tagline : ''));
      if (phone)    lines.push('TEL;TYPE=WORK,VOICE:' + phone);
      if (email)    lines.push('EMAIL;TYPE=WORK:' + email);
      if (url)      lines.push('URL:' + url);
      lines.push('END:VCARD');

      // vCard spec requires CRLF line endings
      const vcard = lines.join('\r\n');

      const qr = qrcode(0, 'M');
      qr.addData(vcard);
      qr.make();
      document.getElementById('qr-code').innerHTML = qr.createSvgTag(2.4, 0);
    }

    function syncFields() {
      const company = document.getElementById('in-company').value;
      const tagline = document.getElementById('in-tagline').value;
      const name    = document.getElementById('in-name').value;
      const position= document.getElementById('in-position').value;
      const email   = document.getElementById('in-email').value;
      const phone   = document.getElementById('in-phone').value;
      const website = document.getElementById('in-website').value;
      const motto   = document.getElementById('in-motto').value;

      document.getElementById('out-company-f').textContent = company;
      document.getElementById('out-company-b').textContent = company;
      document.getElementById('out-tagline-f').textContent = tagline;
      document.getElementById('out-tagline-b').textContent = tagline;
      document.getElementById('out-name').textContent      = name;
      document.getElementById('out-position').textContent  = position;
      document.getElementById('out-email').textContent     = email;
      document.getElementById('out-phone').textContent     = phone;
      document.getElementById('out-website').textContent   = website;
      document.getElementById('out-motto').textContent     = motto;

      buildQR();
    }

    // Wait for fonts + QR to be ready before opening the print dialog
    function doPrint() {
      buildQR();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          setTimeout(function(){ window.print(); }, 200);
        });
      } else {
        setTimeout(function(){ window.print(); }, 200);
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      ['in-company','in-tagline','in-name','in-position','in-email','in-phone','in-website','in-motto']
        .forEach(id => document.getElementById(id).addEventListener('input', syncFields));
      syncFields(); // initial render + QR
    });
  </script>
</body></html>
