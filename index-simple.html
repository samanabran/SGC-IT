<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGC Tech AI Email Signature</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style id="signatureStyle">
        :root {
            --gold-1: #c9a961;
            --gold-2: #b8944b;
            --gold-3: #e0c786;
            --gold-4: #a6853f;
            --dark-1: #121417;
            --dark-2: #1a1f25;
            --dark-3: #202733;
            --light-1: #f8f3e8;
            --line: #dfd3b8;
            --text-muted: #8a8a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Source Sans 3", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 18% 18%, #fffdf7 0%, transparent 42%),
                radial-gradient(circle at 82% 8%, #efe1c4 0%, transparent 38%),
                linear-gradient(165deg, #fbf8f1 0%, #f4ecdd 58%, #ece1cb 100%);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1220px;
            width: 100%;
        }

        .editor-panel,
        .signature-wrapper {
            background: #ffffff;
            border: 1px solid rgba(201, 169, 97, 0.35);
            border-radius: 14px;
            box-shadow: 0 10px 26px rgba(79, 60, 21, 0.14);
        }

        .editor-panel {
            padding: 30px;
            margin-bottom: 30px;
        }

        .editor-panel h2 {
            margin-bottom: 20px;
            color: var(--dark-2);
            font-family: "Montserrat", "Segoe UI", sans-serif;
            font-size: 24px;
            letter-spacing: 0.2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #595959;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .form-group input {
            padding: 12px 14px;
            border: 2px solid #e9e1d0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            font-family: "Source Sans 3", "Segoe UI", sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold-1);
            box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.15);
        }

        .action-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .update-btn,
        .copy-btn {
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: "Montserrat", "Segoe UI", sans-serif;
            letter-spacing: 0.2px;
        }

        .update-btn {
            background: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 100%);
            color: #fff;
            padding: 13px 26px;
        }

        .update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(201, 169, 97, 0.35);
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--dark-2) 0%, var(--dark-1) 100%);
            color: #fff;
            padding: 12px 24px;
            margin-top: 16px;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(18, 20, 23, 0.35);
        }

        .status-message {
            font-size: 14px;
            font-weight: 600;
            color: #357a38;
            min-height: 20px;
            display: flex;
            align-items: center;
        }

        .signature-wrapper {
            padding: 30px;
        }

        .preview-title {
            margin-bottom: 20px;
            color: var(--dark-2);
            text-align: center;
            font-family: "Montserrat", "Segoe UI", sans-serif;
            font-size: 22px;
        }

        .signature-container {
            display: flex;
            gap: 0;
            max-width: 740px;
            margin: 0 auto;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-left {
            background: linear-gradient(135deg, var(--dark-2) 0%, var(--dark-1) 100%);
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-width: 355px;
            border-radius: 8px 0 0 8px;
        }

        .card-left::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-1) 0%, var(--gold-3) 100%);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 24px rgba(201, 169, 97, 0.3);
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            position: relative;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
        }

        .ai-badge {
            position: absolute;
            bottom: -8px;
            right: -10px;
            background: var(--dark-2);
            color: var(--gold-3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            border: 2px solid var(--gold-1);
        }

        .contact-info {
            flex: 1;
        }

        .name {
            font-size: 27px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.4px;
            line-height: 1.1;
        }

        .title {
            font-size: 14px;
            color: var(--gold-3);
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            color: #bcc0c9;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f2f2f2;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .contact-item:hover {
            color: var(--gold-3);
            transform: translateX(3px);
        }

        .contact-icon {
            width: 18px;
            display: inline-flex;
            justify-content: center;
            color: var(--gold-1);
            font-size: 14px;
        }

        .card-right {
            background: linear-gradient(135deg, #faf7f0 0%, #f2e9d8 100%);
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 355px;
            border-radius: 0 8px 8px 0;
            border-left: 3px solid var(--gold-2);
        }

        .company-header {
            margin-bottom: 22px;
        }

        .company-name {
            font-size: 28px;
            font-weight: 800;
            color: var(--dark-2);
            letter-spacing: 1.6px;
            margin-bottom: 4px;
            font-family: "Montserrat", "Segoe UI", sans-serif;
        }

        .company-tagline {
            font-size: 11px;
            color: #666;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .qr-section {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 22px 0;
        }

        .qr-container {
            background: #fff;
            padding: 14px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
            border: 2px solid #efe5cf;
        }

        .qr-code {
            width: 142px;
            height: 142px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-caption {
            margin-top: 8px;
            text-align: center;
            font-size: 11px;
            color: #666;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 2px solid var(--line);
            gap: 10px;
        }

        .social-links {
            display: flex;
            gap: 10px;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            background: var(--dark-2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 13px;
            font-weight: 700;
            font-family: "Montserrat", "Segoe UI", sans-serif;
        }

        .social-icon:hover {
            background: var(--gold-2);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 169, 97, 0.4);
        }

        .tagline {
            font-size: 11px;
            color: #6a6358;
            font-style: italic;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: right;
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 12px;
            }

            .editor-panel,
            .signature-wrapper {
                padding: 18px;
            }

            .signature-container {
                flex-direction: column;
            }

            .card-left,
            .card-right {
                min-width: 100%;
                border-radius: 8px;
            }

            .card-right {
                border-left: none;
                border-top: 3px solid var(--gold-2);
            }

            .name {
                font-size: 24px;
            }

            .company-name {
                font-size: 24px;
            }

            .footer-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .tagline {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-panel">
            <h2>Edit Contact Information</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" value="Renbran Madelo" placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label for="jobTitle">Job Title</label>
                    <input type="text" id="jobTitle" value="Co-Founder and Head of" placeholder="Enter job title">
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" value="Business Performance Metrics" placeholder="Enter department">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" value="renbran@sgctech.ai" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" value="+971 X XXX XXX" placeholder="Enter phone">
                </div>
                <div class="form-group">
                    <label for="website">Website</label>
                    <input type="text" id="website" value="sgctech.ai" placeholder="Enter website">
                </div>
                <div class="form-group">
                    <label for="linkedin">LinkedIn URL</label>
                    <input type="text" id="linkedin" value="https://linkedin.com/company/sgctech" placeholder="LinkedIn URL">
                </div>
                <div class="form-group">
                    <label for="twitter">Twitter/X URL</label>
                    <input type="text" id="twitter" value="https://twitter.com/sgctech" placeholder="Twitter URL">
                </div>
                <div class="form-group">
                    <label for="facebook">Facebook URL</label>
                    <input type="text" id="facebook" value="https://facebook.com/sgctech" placeholder="Facebook URL">
                </div>
                <div class="form-group">
                    <label for="instagram">Instagram URL</label>
                    <input type="text" id="instagram" value="https://instagram.com/sgctech" placeholder="Instagram URL">
                </div>
                <div class="form-group">
                    <label for="vcardUrl">vCard URL (for QR)</label>
                    <input type="text" id="vcardUrl" value="https://sgctech.ai/contact/renbran" placeholder="Enter contact URL">
                </div>
            </div>
            <div class="action-row">
                <button class="update-btn" id="updateButton" type="button">Update Signature</button>
                <div class="status-message" id="statusMessage" aria-live="polite"></div>
            </div>
        </div>

        <div class="signature-wrapper">
            <h2 class="preview-title">Email Signature Preview</h2>

            <div class="signature-container" id="emailSignature">
                <div class="card-left">
                    <div class="logo-section">
                        <div class="logo-container">
                            <div class="logo-icon">
                                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M50 15 L20 40 L20 75 L80 75 L80 40 Z" fill="#f9f2de" stroke="#2a313b" stroke-width="2"></path>
                                    <path d="M50 15 L20 40 L30 40 L50 25 L70 40 L80 40 Z" fill="#1b1f27"></path>
                                    <rect x="45" y="35" width="10" height="15" fill="#2a313b"></rect>
                                    <rect x="30" y="50" width="12" height="12" fill="#ccb170" opacity="0.8"></rect>
                                    <rect x="58" y="50" width="12" height="12" fill="#ccb170" opacity="0.8"></rect>
                                    <rect x="43" y="60" width="14" height="15" fill="#2a313b"></rect>
                                </svg>
                                <div class="ai-badge">AI</div>
                            </div>
                        </div>
                    </div>

                    <div class="contact-info">
                        <div class="name" id="displayName">Renbran Madelo</div>
                        <div class="title" id="displayTitle">Co-Founder and Head of</div>
                        <div class="subtitle" id="displayDepartment">Business Performance Metrics</div>

                        <div class="contact-details">
                            <a href="mailto:renbran@sgctech.ai" class="contact-item" id="displayEmailLink">
                                <span class="contact-icon">@</span>
                                <span id="displayEmail">renbran@sgctech.ai</span>
                            </a>
                            <a href="tel:+971" class="contact-item" id="displayPhoneLink">
                                <span class="contact-icon">P</span>
                                <span id="displayPhone">+971 X XXX XXX</span>
                            </a>
                            <a href="https://sgctech.ai" class="contact-item" id="displayWebsiteLink" target="_blank" rel="noopener noreferrer">
                                <span class="contact-icon">W</span>
                                <span id="displayWebsite">sgctech.ai</span>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="card-right">
                    <div class="company-header">
                        <div class="company-name">SGC TECH AI</div>
                        <div class="company-tagline">Global Consultants</div>
                    </div>

                    <div class="qr-section">
                        <div class="qr-container">
                            <div class="qr-code" id="qrCode"></div>
                            <div class="qr-caption">Scan to save contact</div>
                        </div>
                    </div>

                    <div class="footer-section">
                        <div class="social-links">
                            <a href="https://linkedin.com/company/sgctech" class="social-icon" id="linkedinIcon" title="LinkedIn" target="_blank" rel="noopener noreferrer">in</a>
                            <a href="https://twitter.com/sgctech" class="social-icon" id="twitterIcon" title="Twitter/X" target="_blank" rel="noopener noreferrer">X</a>
                            <a href="https://facebook.com/sgctech" class="social-icon" id="facebookIcon" title="Facebook" target="_blank" rel="noopener noreferrer">f</a>
                            <a href="https://instagram.com/sgctech" class="social-icon" id="instagramIcon" title="Instagram" target="_blank" rel="noopener noreferrer">ig</a>
                        </div>
                        <div class="tagline">Vision. Innovation. Execution.</div>
                    </div>
                </div>
            </div>

            <div style="text-align: center;">
                <button class="copy-btn" id="copyButton" type="button">Copy HTML Signature</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1imU2RYx7jVfQvP6j5J6ZHf2B6A69SDM+jfSxPSbO3fO0v2jVQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        function normalizeUrl(input) {
            const trimmed = input.trim();
            if (!trimmed) {
                return "";
            }
            if (/^(javascript|data|vbscript|file):/i.test(trimmed)) {
                return "";
            }
            if (/^https?:\/\//i.test(trimmed)) {
                return trimmed;
            }
            return "https://" + trimmed;
        }

        function normalizePhoneForTel(input) {
            return input.replace(/[^+\d]/g, "");
        }

        function escapeVCardValue(input) {
            return input
                .replace(/\\/g, "\\\\")
                .replace(/;/g, "\\;")
                .replace(/,/g, "\\,")
                .replace(/\n/g, "\\n");
        }

        function getFormData() {
            return {
                fullName: document.getElementById("fullName").value.trim(),
                jobTitle: document.getElementById("jobTitle").value.trim(),
                department: document.getElementById("department").value.trim(),
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                website: document.getElementById("website").value.trim(),
                linkedin: document.getElementById("linkedin").value.trim(),
                twitter: document.getElementById("twitter").value.trim(),
                facebook: document.getElementById("facebook").value.trim(),
                instagram: document.getElementById("instagram").value.trim(),
                vcardUrl: document.getElementById("vcardUrl").value.trim()
            };
        }

        function getQrPayload(data) {
            const lines = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                "FN:" + escapeVCardValue(data.fullName),
                "ORG:" + escapeVCardValue("SGC Tech AI"),
                "TITLE:" + escapeVCardValue(data.jobTitle + (data.department ? " - " + data.department : "")),
                "EMAIL;TYPE=INTERNET:" + escapeVCardValue(data.email),
                "TEL;TYPE=WORK,VOICE:" + escapeVCardValue(data.phone),
                "URL:" + escapeVCardValue(normalizeUrl(data.vcardUrl || data.website))
            ];

            if (data.website) {
                lines.push("NOTE:" + escapeVCardValue("Company website: " + normalizeUrl(data.website)));
            }

            lines.push("END:VCARD");
            return lines.join("\n");
        }

        function renderQr(payload) {
            const qrElement = document.getElementById("qrCode");
            qrElement.innerHTML = "";
            if (typeof QRCode === "undefined") {
                qrElement.innerHTML = "<span style=\"font-size:11px;color:#b42318;text-align:center;display:block;padding:8px;\">QR unavailable</span>";
                return;
            }
            new QRCode(qrElement, {
                text: payload,
                width: 140,
                height: 140,
                colorDark: "#101216",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function updateSignature() {
            const data = getFormData();
            const websiteUrl = normalizeUrl(data.website);
            const websiteText = data.website.replace(/^https?:\/\//i, "") || "sgctech.ai";

            document.getElementById("displayName").textContent = data.fullName || "Renbran Madelo";
            document.getElementById("displayTitle").textContent = data.jobTitle || "Co-Founder and Head of";
            document.getElementById("displayDepartment").textContent = data.department || "Business Performance Metrics";
            document.getElementById("displayEmail").textContent = data.email || "renbran@sgctech.ai";
            document.getElementById("displayPhone").textContent = data.phone || "+971 X XXX XXX";
            document.getElementById("displayWebsite").textContent = websiteText;

            document.getElementById("displayEmailLink").href = data.email ? "mailto:" + data.email : "#";
            document.getElementById("displayPhoneLink").href = data.phone ? "tel:" + normalizePhoneForTel(data.phone) : "#";
            document.getElementById("displayWebsiteLink").href = websiteUrl || "#";

            document.getElementById("linkedinIcon").href = normalizeUrl(data.linkedin) || "#";
            document.getElementById("twitterIcon").href = normalizeUrl(data.twitter) || "#";
            document.getElementById("facebookIcon").href = normalizeUrl(data.facebook) || "#";
            document.getElementById("instagramIcon").href = normalizeUrl(data.instagram) || "#";

            renderQr(getQrPayload(data));
            setStatus("Signature updated.");
        }

        function setStatus(message, isError) {
            const status = document.getElementById("statusMessage");
            status.textContent = message;
            status.style.color = isError ? "#b42318" : "#357a38";
        }

        async function copySignature() {
            const signatureHtml = document.getElementById("emailSignature").outerHTML;
            const styleHtml = document.getElementById("signatureStyle").outerHTML;
            const fullHtml = "<!DOCTYPE html><html><head><meta charset=\"UTF-8\">" + styleHtml + "</head><body>" + signatureHtml + "</body></html>";

            try {
                if (navigator.clipboard && window.ClipboardItem) {
                    const blobHtml = new Blob([fullHtml], { type: "text/html" });
                    const blobText = new Blob([signatureHtml], { type: "text/plain" });
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            "text/html": blobHtml,
                            "text/plain": blobText
                        })
                    ]);
                } else {
                    const textarea = document.createElement("textarea");
                    textarea.value = fullHtml;
                    textarea.style.position = "fixed";
                    textarea.style.opacity = "0";
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textarea);
                }
                setStatus("Signature HTML copied to clipboard.");
            } catch (error) {
                setStatus("Copy failed. Please copy from preview manually.", true);
            }
        }

        document.getElementById("updateButton").addEventListener("click", updateSignature);
        document.getElementById("copyButton").addEventListener("click", copySignature);

        document.addEventListener("DOMContentLoaded", function () {
            updateSignature();
        });
    </script>
</body>
</html>
